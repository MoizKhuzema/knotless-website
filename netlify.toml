# Netlify build configuration for a static Astro site.
# Astro outputs the finished site to `dist/`, which is what Netlify publishes.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirects live in public/_redirects (copied into dist/), so they apply
# however the site is deployed — Git, CLI or drag-and-drop of dist/.

# Digital cards: serve the "Save contact" vCards as vCards, so iOS opens its
# "Add to Contacts" sheet and Android hands them to Contacts, instead of either
# showing the file as text.
[[headers]]
  for = "/card/*.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "inline"
