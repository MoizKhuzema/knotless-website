name: Deploy to GitHub Pages

# Builds the Astro site and publishes it to GitHub Pages on every push to the
# branches below (and on-demand via the "Run workflow" button).
#
# One-time setup (in the repo): Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that, each push deploys automatically and the
# live URL appears in this workflow's summary.
on:
  push:
    branches:
      - main
      - claude/inspiring-cerf-egxogk
  workflow_dispatch:

# Permissions the deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deploy at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # This GitHub Pages address was an early preview of the site. The real
      # site is https://knotless.com.au/ (Netlify). Every path here now sends
      # visitors there, and is noindexed so search engines drop this copy.
      - name: Build redirect stub
        run: |
          mkdir -p stub
          cat > stub/index.html <<'HTML'
          <!doctype html>
          <html lang="en-AU"><head><meta charset="utf-8">
          <title>Knotless has moved</title>
          <meta name="robots" content="noindex, nofollow">
          <link rel="canonical" href="https://knotless.com.au/">
          <meta http-equiv="refresh" content="0; url=https://knotless.com.au/">
          <script>location.replace("https://knotless.com.au/");</script>
          </head><body><p>Knotless is at <a href="https://knotless.com.au/">knotless.com.au</a>.</p></body></html>
          HTML
          cp stub/index.html stub/404.html
          printf 'User-agent: *\nDisallow: /\n' > stub/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./stub

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
